catalog: mongo
schema: langara-dev-client
sql: "SELECT date_trunc('month', CAST(session_date AS TIMESTAMP)) AS session_date,\
  \ AVG(avg_attempts_per_level) AS \"AVG(avg_attempts_per_level)\" \nFROM (SELECT\n\
  \    CAST(lf.\"create\" AS DATE) AS session_date,\n    ROUND(\n        1.0 * COUNT(*)\n\
  \        / NULLIF(COUNT(DISTINCT CONCAT(CAST(lf.userid AS VARCHAR), '-', lf.levelname)),\
  \ 0), 2\n    ) AS avg_attempts_per_level\nFROM levelflows lf\nJOIN users u ON u._id\
  \ = lf.userid\nWHERE u.role = 'student'\nGROUP BY CAST(lf.\"create\" AS DATE)\n\
  ORDER BY session_date ASC\n) AS virtual_table GROUP BY date_trunc('month', CAST(session_date\
  \ AS TIMESTAMP))"
