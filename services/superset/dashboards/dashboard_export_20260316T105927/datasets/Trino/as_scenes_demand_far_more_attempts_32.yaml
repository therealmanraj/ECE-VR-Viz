catalog: mongo
schema: langara-dev-client
sql: "SELECT scene_no AS scene_no, level_name AS level_name, SUM(total_wrong_attempts)/SUM(unique_sessions)\
  \ AS \"Wrong Attempts per Session\" \nFROM (SELECT\n    lf.levelname AS level_name,\n\
  \    CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT) AS scene_no,\n\
  \    COUNT(DISTINCT lf._id) AS unique_sessions,\n    SUM(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.isCorrect') = 'false'\n        AND json_extract_scalar(conv_obj, '$.type')\
  \ = 'user'\n        THEN 1 ELSE 0 END) AS total_wrong_attempts\nFROM levelflows\
  \ lf\nJOIN users u ON u._id = lf.userid\nCROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON)))\
  \ AS t(scene_obj)\nCROSS JOIN UNNEST(CAST(json_extract(scene_obj, '$.conversations')\
  \ AS ARRAY(JSON))) AS t2(conv_obj)\nWHERE u.role = 'student'\nGROUP BY lf.levelname,\
  \ json_extract_scalar(scene_obj, '$.sceneNo')\nORDER BY level_name, scene_no\n)\
  \ AS virtual_table GROUP BY scene_no, level_name ORDER BY scene_no ASC, level_name\
  \ ASC;"
