sql: "SELECT personality AS personality, AVG(completion_rate_pct) AS \"AVG(completion_rate_pct)\"\
  \ \nFROM (SELECT\n    lf.personality_childb AS personality,\n    u.username AS student_name,\n\
  \    lf.levelname AS level_name,\n    COUNT(*) AS total_sessions,\n    COALESCE(ROUND(\n\
  \        100.0 * SUM(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)\n    \
  \    / NULLIF(COUNT(*), 0), 1\n    ), 0) AS completion_rate_pct,\n    COALESCE(ROUND(\n\
  \        1.0 * COUNT(*)\n        / NULLIF(COUNT(DISTINCT lf.userid), 0), 2\n   \
  \ ), 0) AS avg_attempts\nFROM levelflows lf\nJOIN users u ON u._id = lf.userid\n\
  WHERE u.role = 'student'\nAND lf.personality_childb IS NOT NULL\nGROUP BY lf.personality_childb,\
  \ u.username, lf.levelname\nORDER BY completion_rate_pct ASC\n) AS virtual_table\
  \ GROUP BY personality ORDER BY \"AVG(completion_rate_pct)\" DESC;"
