catalog: mongo
schema: langara-dev-client
sql: "SELECT personality AS personality, level_name AS level_name, sum(completed_sessions)\
  \ AS \"SUM(completed_sessions)\" \nFROM (SELECT\n    lf.personality_childb AS personality,\n\
  \    lf.levelname AS level_name,\n    u.username AS student_name,\n    COUNT(*)\
  \ AS total_sessions,\n    SUM(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)\
  \ AS completed_sessions,\n    COALESCE(ROUND(\n        100.0 * SUM(CASE WHEN lf.levelcomplete\
  \ = true THEN 1 ELSE 0 END)\n        / NULLIF(COUNT(*), 0), 1\n    ), 0) AS pass_rate_pct\n\
  FROM levelflows lf\nJOIN users u ON u._id = lf.userid\nWHERE u.role = 'student'\n\
  AND lf.personality_childb IS NOT NULL\nGROUP BY lf.personality_childb, lf.levelname,\
  \ u.username\nORDER BY pass_rate_pct ASC\n) AS virtual_table GROUP BY personality,\
  \ level_name ORDER BY \"SUM(completed_sessions)\" DESC;\n"
