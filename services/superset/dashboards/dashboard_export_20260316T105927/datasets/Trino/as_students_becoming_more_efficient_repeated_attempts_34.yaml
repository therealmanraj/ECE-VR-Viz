catalog: mongo
schema: langara-dev-client
sql: "SELECT attempt_number AS attempt_number, level_name AS level_name, AVG(incorrect_before_correct)\
  \ AS \"AVG(incorrect_before_correct)\" \nFROM (SELECT\n    lf.levelname AS level_name,\n\
  \    u.username AS student_name,\n    ROW_NUMBER() OVER (\n        PARTITION BY\
  \ lf.userid, lf.levelname\n        ORDER BY lf.\"create\" ASC\n    ) AS attempt_number,\n\
  \    COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user' \n       \
  \   AND json_extract_scalar(conv_obj, '$.isCorrect') = 'false' \n          THEN\
  \ 1 END) AS incorrect_before_correct,\n    COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' \n          THEN 1 END) AS total_responses\nFROM levelflows\
  \ lf\nJOIN users u ON u._id = lf.userid\nCROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON)))\
  \ AS t(scene_obj)\nCROSS JOIN UNNEST(CAST(json_extract(scene_obj, '$.conversations')\
  \ AS ARRAY(JSON))) AS t2(conv_obj)\nWHERE u.role = 'student'\nGROUP BY lf.levelname,\
  \ lf.userid, u.username, lf._id, lf.\"create\"\nORDER BY level_name, attempt_number\n\
  ) AS virtual_table GROUP BY attempt_number, level_name ORDER BY \"AVG(incorrect_before_correct)\"\
  \ DESC;"
