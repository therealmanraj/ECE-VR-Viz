sql: "SELECT scene_no AS scene_no, level_name AS level_name, sum(total_attempts) AS\
  \ \"SUM(total_attempts)\", sum(scenes_completed) AS \"SUM(scenes_completed)\" \n\
  FROM (SELECT\n    lf.levelname AS level_name,\n    u.username AS student_name,\n\
  \    CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT) AS scene_no,\n\
  \    COUNT(*) AS total_attempts,\n    SUM(CASE WHEN json_extract_scalar(scene_obj,\
  \ '$.sceneComplete') = 'true' THEN 1 ELSE 0 END) AS scenes_completed,\n    COALESCE(ROUND(\n\
  \        100.0 * SUM(CASE WHEN json_extract_scalar(scene_obj, '$.sceneComplete')\
  \ = 'true' THEN 1 ELSE 0 END)\n        / NULLIF(COUNT(*), 0), 1\n    ), 0) AS scene_completion_pct\n\
  FROM levelflows lf\nJOIN users u ON u._id = lf.userid\nCROSS JOIN UNNEST(CAST(lf.scene\
  \ AS ARRAY(JSON))) AS t(scene_obj)\nWHERE u.role = 'student'\nGROUP BY lf.levelname,\
  \ u.username, json_extract_scalar(scene_obj, '$.sceneNo')\nORDER BY level_name,\
  \ scene_no\n) AS virtual_table \nWHERE level_name IN ('Demo Train', 'Demo Snack',\
  \ 'Demo Birthday', 'Snack Table 3 fake') GROUP BY scene_no, level_name ORDER BY\
  \ \"SUM(total_attempts)\" DESC;"
