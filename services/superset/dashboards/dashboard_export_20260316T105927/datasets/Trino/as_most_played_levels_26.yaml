schema: langara-dev-client
sql: "SELECT level_name AS level_name, sum(total_sessions) AS \"SUM(total_sessions)\"\
  \ \nFROM (SELECT\n    lf.levelname AS level_name,\n    COUNT(*) AS total_sessions,\n\
  \    COUNT(DISTINCT lf.userid) AS unique_students\nFROM levelflows lf\nJOIN users\
  \ u ON u._id = lf.userid\nWHERE u.role = 'student'\nGROUP BY lf.levelname\nORDER\
  \ BY total_sessions DESC\n) AS virtual_table GROUP BY level_name ORDER BY \"SUM(total_sessions)\"\
  \ DESC;"
