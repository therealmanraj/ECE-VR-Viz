catalog: mongo
schema: langara-dev-client
sql: "SELECT session_id AS session_id, level_name AS level_name, AVG(furthest_scene)\
  \ AS \"AVG(furthest_scene)\" \nFROM (SELECT\n    lf.levelname AS level_name,\n \
  \   lf._id AS session_id,\n    MAX(CAST(json_extract_scalar(scene_obj, '$.sceneNo')\
  \ AS BIGINT)) AS furthest_scene\nFROM levelflows lf\nJOIN users u ON u._id = lf.userid\n\
  CROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\nWHERE u.role =\
  \ 'student'\nAND json_extract_scalar(scene_obj, '$.sceneComplete') = 'true'\nGROUP\
  \ BY lf.levelname, lf._id\n) AS virtual_table GROUP BY session_id, level_name ORDER\
  \ BY \"AVG(furthest_scene)\" DESC;"
