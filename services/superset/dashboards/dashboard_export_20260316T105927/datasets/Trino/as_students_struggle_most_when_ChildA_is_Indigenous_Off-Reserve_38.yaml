catalog: mongo
schema: langara-dev-client
sql: "SELECT child_b_personality AS child_b_personality, child_a_identity AS child_a_identity,\
  \ AVG(pass_rate_pct) AS \"AVG(pass_rate_pct)\" \nFROM (SELECT\n    lf.personality_childa\
  \ AS child_a_identity,\n    lf.personality_childb AS child_b_personality,\n    u.username\
  \ AS student_name,\n    lf.levelname AS level_name,\n    COUNT(*) AS total_sessions,\n\
  \    SUM(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END) AS completed_sessions,\n\
  \    COALESCE(ROUND(\n        100.0 * SUM(CASE WHEN lf.levelcomplete = true THEN\
  \ 1 ELSE 0 END)\n        / NULLIF(COUNT(*), 0), 1\n    ), 0) AS pass_rate_pct\n\
  FROM levelflows lf\nJOIN users u ON u._id = lf.userid\nWHERE u.role = 'student'\n\
  AND lf.personality_childa IS NOT NULL\nAND lf.personality_childb IS NOT NULL\nGROUP\
  \ BY lf.personality_childa, lf.personality_childb, u.username, lf.levelname\nORDER\
  \ BY child_b_personality, pass_rate_pct ASC\n) AS virtual_table GROUP BY child_b_personality,\
  \ child_a_identity ORDER BY \"AVG(pass_rate_pct)\" DESC;"
