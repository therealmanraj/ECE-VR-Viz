sql: "SELECT completion_status AS completion_status, sum(session_count) AS \"SUM(session_count)\"\
  \ \nFROM (SELECT\n    CASE WHEN lf.levelcomplete = true THEN 'Completed' ELSE 'Not\
  \ Completed' END AS completion_status,\n    lf.levelname AS level_name,\n    u.username\
  \ AS student_name,\n    COUNT(*) AS session_count\nFROM levelflows lf\nJOIN users\
  \ u ON u._id = lf.userid\nWHERE u.role = 'student'\nGROUP BY \n    CASE WHEN lf.levelcomplete\
  \ = true THEN 'Completed' ELSE 'Not Completed' END,\n    lf.levelname,\n    u.username\n\
  ORDER BY completion_status\n) AS virtual_table GROUP BY completion_status ORDER\
  \ BY \"SUM(session_count)\" DESC;"
