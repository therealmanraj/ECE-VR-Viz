catalog: mongo
schema: langara-dev-client
sql: "SELECT date_trunc('day', CAST(session_date AS TIMESTAMP)) AS session_date, sum(total_sessions)\
  \ AS \"Total Sessions\" \nFROM (SELECT\n    CAST(lf.\"create\" AS DATE) AS session_date,\n\
  \    lf.levelname AS level_name,\n    COUNT(*) AS total_sessions,\n    COUNT(DISTINCT\
  \ lf.userid) AS unique_students\nFROM levelflows lf\nJOIN users u ON u._id = lf.userid\n\
  WHERE u.role = 'student'\nGROUP BY CAST(lf.\"create\" AS DATE), lf.levelname\nORDER\
  \ BY session_date ASC\n) AS virtual_table GROUP BY date_trunc('day', CAST(session_date\
  \ AS TIMESTAMP)) ORDER BY \"Total Sessions\" DESC;"
