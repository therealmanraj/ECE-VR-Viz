sql: "SELECT student_name AS student_name, level_name AS level_name, AVG(attempt_count)\
  \ AS \"AVG(attempt_count)\" \nFROM (SELECT\n    lf.userid AS user_id,\n    u.username\
  \ AS student_name,\n    lf.levelname AS level_name,\n    COUNT(*) AS attempt_count,\n\
  \    MAX(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END) AS eventually_completed\n\
  FROM levelflows lf\nJOIN users u ON u._id = lf.userid\nWHERE u.role = 'student'\n\
  GROUP BY lf.userid, u.username, lf.levelname\nORDER BY attempt_count DESC\n) AS\
  \ virtual_table GROUP BY student_name, level_name;"
