schema: langara-dev-client
sql: "SELECT\n    CAST(lf.\"create\" AS DATE) AS session_date,\n    COUNT(*) AS total_sessions\n\
  FROM levelflows lf\nJOIN users u ON u._id = lf.userid\nWHERE u.role = 'student'\n\
  GROUP BY CAST(lf.\"create\" AS DATE)\nORDER BY session_date ASC"
