catalog: mongo
schema: langara-dev-client
sql: "SELECT model_type AS model_type, level_name AS level_name, AVG(accuracy) AS\
  \ \"AVG(accuracy)\" \nFROM (SELECT\n    CASE WHEN tm.blame = true THEN 'Blame Model'\
  \ ELSE 'General Model' END AS model_type,\n    json_extract_scalar(tm.level, '$.name')\
  \ AS level_name,\n    json_extract_scalar(tm.scene, '$[0].name') AS scene_name,\n\
  \    tm.accuracy\nFROM trainingmodels tm\nWHERE tm.accuracy IS NOT NULL\nAND json_extract_scalar(tm.level,\
  \ '$.name') IN ('Demo Snack', 'Demo Train', 'Demo Birthday')\nORDER BY model_type,\
  \ level_name\n) AS virtual_table GROUP BY model_type, level_name ORDER BY \"AVG(accuracy)\"\
  \ DESC;"
