catalog: mongo
schema: langara-dev-client
sql: "SELECT source AS source, target AS target, sum(session_count) AS \"SUM(session_count)\"\
  \ \nFROM (SELECT\n    lf.levelname AS level_name,\n    lf.personality_childb AS\
  \ personality,\n    u.username AS student_name,\n    CONCAT('Scene ', CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS VARCHAR)) AS source,\n    CASE \n        WHEN json_extract_scalar(scene_obj,\
  \ '$.sceneComplete') = 'true' \n        THEN CONCAT('Scene ', CAST((CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS BIGINT) + 1) AS VARCHAR))\n        ELSE 'Drop Off'\n    END AS\
  \ target,\n    COUNT(*) AS session_count\nFROM levelflows lf\nJOIN users u ON u._id\
  \ = lf.userid\nCROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\n\
  WHERE u.role = 'student'\nAND lf.levelname = 'Demo Snack'\nGROUP BY lf.levelname,\
  \ lf.personality_childb, u.username,\n    json_extract_scalar(scene_obj, '$.sceneNo'),\n\
  \    json_extract_scalar(scene_obj, '$.sceneComplete')\nORDER BY source, target\n\
  ) AS virtual_table GROUP BY source, target;"
