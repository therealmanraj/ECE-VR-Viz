sql: "SELECT personality AS personality, childb_avatar AS childb_avatar, sum(session_share_pct)\
  \ AS \"SUM(session_share_pct)\" \nFROM (SELECT\n    lf.personality_childb AS personality,\n\
  \    json_extract_scalar(lf.avatarinfo, '$.ChildB') AS childb_avatar,\n    u.username\
  \ AS student_name,\n    lf.levelname AS level_name,\n    COUNT(*) AS sessions,\n\
  \    COALESCE(ROUND(\n        100.0 * COUNT(*)\n        / NULLIF(SUM(COUNT(*)) OVER\
  \ (PARTITION BY lf.personality_childb), 0), 1\n    ), 0) AS session_share_pct\n\
  FROM levelflows lf\nJOIN users u ON u._id = lf.userid\nWHERE u.role = 'student'\n\
  AND lf.personality_childb IS NOT NULL\nAND lf.avatarinfo IS NOT NULL\nGROUP BY lf.personality_childb,\
  \ json_extract_scalar(lf.avatarinfo, '$.ChildB'),\n    u.username, lf.levelname\n\
  ORDER BY personality, childb_avatar\n) AS virtual_table GROUP BY personality, childb_avatar\
  \ ORDER BY \"SUM(session_share_pct)\" DESC;"
