sql: "-- Dataset Name: ds_student_vs_class_passrate\n-- Student pass rate vs class\
  \ average per level\nSELECT\n    lf.userid,\n    u.username,\n    lf.levelname,\n\
  \    lf.personality_childb,\n    -- This student's pass rate\n    COALESCE(ROUND(\n\
  \        100.0 * SUM(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)\n    \
  \    / NULLIF(COUNT(DISTINCT lf._id), 0), 1), 0)                  AS student_pass_rate_pct,\n\
  \    -- Class average pass rate for the same level + personality\n    ROUND(AVG(COALESCE(\n\
  \        100.0 * SUM(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)\n    \
  \    / NULLIF(COUNT(DISTINCT lf._id), 0), 0))\n        OVER (PARTITION BY lf.levelname,\
  \ lf.personality_childb), 1)  AS class_avg_pass_rate_pct\nFROM levelflows lf\nJOIN\
  \ users u ON lf.userid = u._id\nGROUP BY lf.userid, u.username, lf.levelname, lf.personality_childb\n\
  ORDER BY u.username, lf.levelname\n\n"
