sql: "-- Dataset Name: ds_student_scene_responses\n-- Correct vs wrong responses per\
  \ scene for one student + class average\n-- userid filter applied in Superset native\
  \ filter\nSELECT\n    lf.userid,\n    u.username,\n    lf.levelname,\n    lf.personality_childb,\n\
  \    CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT)      AS scene_no,\n\
  \    json_extract_scalar(scene_obj, '$.purpose')                      AS scene_purpose,\n\
  \    -- Student-level counts\n    COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\n               AND json_extract_scalar(conv_obj, '$.isCorrect')\
  \ = 'true' THEN 1 END)\n                                                       \
  \              AS correct_responses,\n    COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\n               AND json_extract_scalar(conv_obj, '$.isCorrect')\
  \ = 'false' THEN 1 END)\n                                                      \
  \               AS wrong_responses,\n    COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\n               AND json_extract_scalar(conv_obj, '$.blame')\
  \ = 'true' THEN 1 END)\n                                                       \
  \              AS blame_responses,\n    -- Class average correct responses at this\
  \ scene (for comparison overlay)\n    ROUND(AVG(COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\n                         AND json_extract_scalar(conv_obj,\
  \ '$.isCorrect') = 'true' THEN 1 END))\n        OVER (PARTITION BY lf.levelname,\
  \ lf.personality_childb,\n              CAST(json_extract_scalar(scene_obj, '$.sceneNo')\
  \ AS BIGINT)), 1)\n                                                            \
  \         AS class_avg_correct,\n    ROUND(AVG(COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\n                         AND json_extract_scalar(conv_obj,\
  \ '$.isCorrect') = 'false' THEN 1 END))\n        OVER (PARTITION BY lf.levelname,\
  \ lf.personality_childb,\n              CAST(json_extract_scalar(scene_obj, '$.sceneNo')\
  \ AS BIGINT)), 1)\n                                                            \
  \         AS class_avg_wrong\nFROM levelflows lf\nJOIN users u ON lf.userid = u._id\n\
  CROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\nCROSS JOIN UNNEST(CAST(json_extract(scene_obj,\
  \ '$.conversations') AS ARRAY(JSON))) AS t2(conv_obj)\nGROUP BY\n    lf.userid,\
  \ u.username, lf.levelname, lf.personality_childb,\n    CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS BIGINT),\n    json_extract_scalar(scene_obj, '$.purpose')\nORDER\
  \ BY lf.userid, lf.levelname, scene_no\n\n"
