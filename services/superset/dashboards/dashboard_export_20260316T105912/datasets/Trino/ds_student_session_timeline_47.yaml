sql: "-- Dataset Name: ds_student_session_timeline\n-- Learning curve: scenes completed\
  \ per session over time\n-- Shows improvement (or regression) across attempts\n\
  SELECT\n    lf.userid,\n    u.username,\n    lf.levelname,\n    lf.personality_childb,\n\
  \    lf._id                                                           AS flow_id,\n\
  \    CAST(lf.create AS DATE)                                          AS session_date,\n\
  \    lf.levelcomplete,\n    MAX(CASE WHEN json_extract_scalar(scene_obj, '$.sceneComplete')\
  \ = 'true'\n             THEN CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS\
  \ BIGINT)\n             ELSE 0 END)                                            \
  \ AS scenes_completed,\n    date_diff('second',\n        CAST(lf.create AS TIMESTAMP),\n\
  \        CAST(lf.update AS TIMESTAMP))                                AS session_duration_seconds,\n\
  \    lf.__v                                                           AS attempt_number\n\
  FROM levelflows lf\nJOIN users u ON lf.userid = u._id\nCROSS JOIN UNNEST(CAST(lf.scene\
  \ AS ARRAY(JSON))) AS t(scene_obj)\nGROUP BY\n    lf.userid, u.username, lf.levelname,\
  \ lf.personality_childb,\n    lf._id, lf.create, lf.update, lf.levelcomplete, lf.__v\n\
  ORDER BY lf.userid, lf.levelname, lf.create\n\n"
