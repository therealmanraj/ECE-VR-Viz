sql: "-- Dataset Name: ds_student_blame_by_child\n-- Student's blame rate per child\
  \ personality vs class average\nSELECT\n    lf.userid,\n    u.username,\n    lf.levelname,\n\
  \    lf.personality_childb,\n    -- This student's blame rate for this child personality\n\
  \    COALESCE(ROUND(\n        100.0 * COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\n                           AND json_extract_scalar(conv_obj,\
  \ '$.blame') = 'true' THEN 1 END)\n        / NULLIF(COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END), 0)\n    , 1), 0)                             \
  \                            AS student_blame_rate_pct,\n    -- Class average blame\
  \ rate for the same child personality\n    ROUND(AVG(COALESCE(\n        100.0 *\
  \ COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user'\n           \
  \                AND json_extract_scalar(conv_obj, '$.blame') = 'true' THEN 1 END)\n\
  \        / NULLIF(COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user'\
  \ THEN 1 END), 0)\n    , 0)) OVER (PARTITION BY lf.levelname, lf.personality_childb),\
  \ 1)\n                                                                     AS class_avg_blame_rate_pct\n\
  FROM levelflows lf\nJOIN users u ON lf.userid = u._id\nCROSS JOIN UNNEST(CAST(lf.scene\
  \ AS ARRAY(JSON))) AS t(scene_obj)\nCROSS JOIN UNNEST(CAST(json_extract(scene_obj,\
  \ '$.conversations') AS ARRAY(JSON))) AS t2(conv_obj)\nGROUP BY lf.userid, u.username,\
  \ lf.levelname, lf.personality_childb\nORDER BY u.username, lf.levelname\n\n"
