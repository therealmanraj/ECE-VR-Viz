sql: "-- Dataset Name: ds_student_child_empathy_scores\n-- User's pre-assigned empathy/relationship\
  \ score per child avatar\n-- Joins users.children JSON array to personality name\
  \ mapping\n-- personality integer mapping: 0=Bad_Day, 1=War_Refugee, 2=Foster_Care,\n\
  --   3=PDA_Autism, 4=Indigenous_Off-Reserve, 5=Indigenous_Family\nSELECT\n    u._id\
  \                                                            AS userid,\n    u.username,\n\
  \    json_extract_scalar(child_obj, '$.childB')                       AS childb_avatar,\n\
  \    CAST(json_extract_scalar(child_obj, '$.personality') AS BIGINT)  AS empathy_score,\n\
  \    CASE CAST(json_extract_scalar(child_obj, '$.personality') AS BIGINT)\n    \
  \    WHEN 0 THEN 'Bad_Day'\n        WHEN 1 THEN 'War_Refugee'\n        WHEN 2 THEN\
  \ 'Foster_Care'\n        WHEN 3 THEN 'PDA_Autism'\n        WHEN 4 THEN 'Indigenous\
  \ Off-Reserve'\n        WHEN 5 THEN 'Indigenous Family'\n        ELSE 'Unknown'\n\
  \    END                                                              AS personality_childb\n\
  FROM users u\nCROSS JOIN UNNEST(CAST(u.children AS ARRAY(JSON))) AS t(child_obj)\n\
  WHERE u.role IN ('student', 'instructor')\nORDER BY u.username, empathy_score DESC\n\
  \n"
