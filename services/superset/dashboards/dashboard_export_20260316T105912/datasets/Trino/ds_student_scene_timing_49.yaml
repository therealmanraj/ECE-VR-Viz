catalog: mongo
schema: langara-dev-client
sql: "SELECT\n    s.userid,\n    s.username,\n    s.scene_no,\n    s.student_avg_seconds,\n\
  \    c.class_avg_seconds\nFROM (\n    SELECT\n        userid,\n        username,\n\
  \        scene_no,\n        ROUND(AVG(CASE WHEN time_on_scene <= 600 THEN time_on_scene\
  \ END), 0) AS student_avg_seconds\n    FROM (\n        SELECT\n            lf.userid,\n\
  \            u.username,\n            CAST(json_extract_scalar(scene_obj, '$.sceneNo')\
  \ AS BIGINT) AS scene_no,\n            COALESCE(\n                date_diff('second',\n\
  \                    CAST(replace(replace(\n                        json_extract_scalar(json_extract(scene_obj,\
  \ '$.create'), '$[\"$date\"]'),\n                        'T', ' '), 'Z', '') AS\
  \ TIMESTAMP),\n                    LEAD(CAST(replace(replace(\n                \
  \        json_extract_scalar(json_extract(scene_obj, '$.create'), '$[\"$date\"]'),\n\
  \                        'T', ' '), 'Z', '') AS TIMESTAMP))\n                  \
  \      OVER (PARTITION BY lf._id\n                              ORDER BY CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS BIGINT))\n                ),\n                date_diff('second',\n\
  \                    CAST(replace(replace(\n                        json_extract_scalar(json_extract(scene_obj,\
  \ '$.create'), '$[\"$date\"]'),\n                        'T', ' '), 'Z', '') AS\
  \ TIMESTAMP),\n                    CAST(lf.update AS TIMESTAMP)\n              \
  \  )\n            ) AS time_on_scene\n        FROM levelflows lf\n        JOIN users\
  \ u ON lf.userid = u._id\n        CROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON)))\
  \ AS t(scene_obj)\n    ) session_scenes\n    GROUP BY userid, username, scene_no\n\
  ) s\nJOIN (\n    SELECT\n        scene_no,\n        ROUND(AVG(student_avg), 0) AS\
  \ class_avg_seconds\n    FROM (\n        SELECT\n            userid,\n         \
  \   scene_no,\n            AVG(CASE WHEN time_on_scene <= 600 THEN time_on_scene\
  \ END) AS student_avg\n        FROM (\n            SELECT\n                lf.userid,\n\
  \                CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT) AS\
  \ scene_no,\n                COALESCE(\n                    date_diff('second',\n\
  \                        CAST(replace(replace(\n                            json_extract_scalar(json_extract(scene_obj,\
  \ '$.create'), '$[\"$date\"]'),\n                            'T', ' '), 'Z', '')\
  \ AS TIMESTAMP),\n                        LEAD(CAST(replace(replace(\n         \
  \                   json_extract_scalar(json_extract(scene_obj, '$.create'), '$[\"\
  $date\"]'),\n                            'T', ' '), 'Z', '') AS TIMESTAMP))\n  \
  \                          OVER (PARTITION BY lf._id\n                         \
  \         ORDER BY CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT))\n\
  \                    ),\n                    date_diff('second',\n             \
  \           CAST(replace(replace(\n                            json_extract_scalar(json_extract(scene_obj,\
  \ '$.create'), '$[\"$date\"]'),\n                            'T', ' '), 'Z', '')\
  \ AS TIMESTAMP),\n                        CAST(lf.update AS TIMESTAMP)\n       \
  \             )\n                ) AS time_on_scene\n            FROM levelflows\
  \ lf\n            CROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\n\
  \        ) class_scenes\n        GROUP BY userid, scene_no\n    ) per_student\n\
  \    GROUP BY scene_no\n) c ON c.scene_no = s.scene_no\nORDER BY s.userid, s.scene_no"
