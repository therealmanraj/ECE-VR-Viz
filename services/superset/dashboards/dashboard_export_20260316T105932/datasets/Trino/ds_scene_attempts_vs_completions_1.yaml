sql: "-- Dataset Name: ds_scene_attempts_vs_completions\n-- scene is JSON type in\
  \ Trino \u2014 cast to ARRAY(JSON) then extract fields with json_extract_scalar\n\
  SELECT\n    CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT) AS scene_no,\n\
  \    lf.levelname                                                AS level_name,\n\
  \    COUNT(*)                                                    AS total_attempts,\n\
  \    SUM(CASE WHEN json_extract_scalar(scene_obj, '$.sceneComplete') = 'true' THEN\
  \ 1 ELSE 0 END)      AS scenes_completed,\n    COALESCE(ROUND(\n        100.0 *\
  \ SUM(CASE WHEN json_extract_scalar(scene_obj, '$.sceneComplete') = 'true' THEN\
  \ 1 ELSE 0 END)\n        / NULLIF(COUNT(*), 0), 1\n    ), 0)                   \
  \                                    AS scene_completion_pct\nFROM levelflows lf\n\
  CROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\nGROUP BY json_extract_scalar(scene_obj,\
  \ '$.sceneNo'), lf.levelname\nORDER BY lf.levelname, scene_no\n\n"
