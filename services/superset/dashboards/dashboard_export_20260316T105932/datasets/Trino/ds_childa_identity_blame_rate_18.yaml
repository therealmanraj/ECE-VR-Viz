sql: "-- Dataset Name: ds_childa_identity_blame_rate\n-- One row per childa_identity\
  \ x childb_identity \u2014 blame rate via conversation unnest\n-- Root cause fix:\
  \ aggregate at identity level so SUM() in Superset reads one value per cell\nSELECT\n\
  \    lf.personality_childa                                            AS childa_identity,\n\
  \    lf.personality_childb                                            AS childb_identity,\n\
  \    COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user' THEN 1 END)\n\
  \                                                                     AS total_responses,\n\
  \    COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user'\n        \
  \       AND json_extract_scalar(conv_obj, '$.blame') = 'true' THEN 1 END)\n    \
  \                                                                 AS blame_responses,\n\
  \    COALESCE(ROUND(\n        100.0 * COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\n                           AND json_extract_scalar(conv_obj,\
  \ '$.blame') = 'true' THEN 1 END)\n        / NULLIF(COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END), 0), 1\n    ), 0)                             \
  \                               AS blame_rate_pct\nFROM levelflows lf\nCROSS JOIN\
  \ UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\nCROSS JOIN UNNEST(CAST(json_extract(scene_obj,\
  \ '$.conversations') AS ARRAY(JSON))) AS t2(conv_obj)\nWHERE lf.personality_childa\
  \ IS NOT NULL\n  AND lf.personality_childb IS NOT NULL\nGROUP BY\n    lf.personality_childa,\n\
  \    lf.personality_childb\nORDER BY childa_identity, childb_identity\n\n"
