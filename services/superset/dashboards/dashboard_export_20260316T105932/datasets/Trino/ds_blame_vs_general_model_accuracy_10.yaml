sql: "-- Dataset Name: ds_blame_vs_general_model_accuracy\nSELECT\n    json_extract_scalar(tm.level,\
  \ '$.name')                     AS level_name,\n    CASE WHEN tm.blame = true THEN\
  \ 'Blame Model'\n         ELSE 'General Model' END                             \
  \  AS model_type,\n    ROUND(AVG(tm.accuracy), 3)                              \
  \    AS avg_accuracy,\n    MAX(tm.accuracy)                                    \
  \        AS max_accuracy,\n    COUNT(*)                                        \
  \            AS model_count\nFROM trainingmodels tm\nWHERE tm.accuracy IS NOT NULL\n\
  GROUP BY json_extract_scalar(tm.level, '$.name'), tm.blame\nORDER BY level_name,\
  \ model_type\n\n"
