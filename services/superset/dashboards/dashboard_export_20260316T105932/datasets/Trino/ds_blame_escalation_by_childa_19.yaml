sql: "-- Dataset Name: ds_blame_escalation_by_childa\n-- Blame and correctness across\
  \ scene progression per ChildA identity\n-- Reveals frustration build-up and resolution\
  \ patterns within a session\nSELECT\n    json_extract_scalar(lf.avatarinfo, '$.ChildA')\
  \                  AS childa_avatar,\n    lf.personality_childa                \
  \                            AS childa_identity,\n    CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS BIGINT)      AS scene_no,\n    COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END)\n                                             \
  \                        AS total_responses,\n    COALESCE(ROUND(\n        100.0\
  \ * COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user'\n         \
  \                  AND json_extract_scalar(conv_obj, '$.blame') = 'true' THEN 1\
  \ END)\n        / NULLIF(COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type')\
  \ = 'user' THEN 1 END), 0), 1\n    ), 0)                                       \
  \                     AS blame_rate_pct,\n    COALESCE(ROUND(\n        100.0 * COUNT(CASE\
  \ WHEN json_extract_scalar(conv_obj, '$.isCorrect') = 'true' THEN 1 END)\n     \
  \   / NULLIF(COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user' THEN\
  \ 1 END), 0), 1\n    ), 0)                                                     \
  \       AS correct_rate_pct,\n    COALESCE(ROUND(\n        100.0 * SUM(CASE WHEN\
  \ json_extract_scalar(scene_obj, '$.sceneComplete') = 'true' THEN 1 ELSE 0 END)\n\
  \        / NULLIF(COUNT(DISTINCT lf._id), 0), 1\n    ), 0)                     \
  \                                       AS scene_completion_pct\nFROM levelflows\
  \ lf\nCROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\nCROSS JOIN\
  \ UNNEST(CAST(json_extract(scene_obj, '$.conversations') AS ARRAY(JSON))) AS t2(conv_obj)\n\
  WHERE lf.avatarinfo IS NOT NULL\nGROUP BY\n    json_extract_scalar(lf.avatarinfo,\
  \ '$.ChildA'),\n    lf.personality_childa,\n    CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS BIGINT)\nHAVING COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END) >= 5\nORDER BY childa_identity, scene_no\n\n"
