sql: "-- Dataset Name: ds_level_popularity\nSELECT\n    lf.levelname             \
  \                                   AS level_name,\n    COUNT(*)               \
  \                                     AS total_sessions,\n    COUNT(DISTINCT lf.userid)\
  \                                   AS unique_students\nFROM levelflows lf\nJOIN\
  \ users u ON u._id = lf.userid\nWHERE u.role = 'student'\nGROUP BY lf.levelname\n\
  ORDER BY total_sessions DESC\n\n"
