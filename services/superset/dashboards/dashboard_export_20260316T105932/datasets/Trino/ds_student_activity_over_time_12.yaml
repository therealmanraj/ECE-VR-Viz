schema: langara-dev-client
sql: "-- Dataset Name: ds_student_activity_over_time\nSELECT\n    CAST(lf.\"create\"\
  \ AS DATE)                                     AS session_date,\n    COUNT(*)  \
  \                                                  AS sessions_started,\n    COUNT(DISTINCT\
  \ lf.userid)                                   AS unique_students,\n    lf.levelname\
  \                                                AS level_name\nFROM levelflows\
  \ lf\nJOIN users u ON u._id = lf.userid\nWHERE u.role = 'student'\nGROUP BY CAST(lf.\"\
  create\" AS DATE), lf.levelname\nORDER BY session_date\n\n"
