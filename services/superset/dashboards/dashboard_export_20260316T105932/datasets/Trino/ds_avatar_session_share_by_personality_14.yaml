sql: "-- Dataset Name: ds_avatar_session_share_by_personality\nSELECT\n    lf.personality_childb\
  \                                           AS personality,\n    json_extract_scalar(lf.avatarinfo,\
  \ '$.ChildB')                  AS childb_avatar,\n    COUNT(*)                 \
  \                                       AS sessions,\n    COALESCE(ROUND(\n    \
  \    100.0 * COUNT(*)\n        / NULLIF(SUM(COUNT(*)) OVER (PARTITION BY lf.personality_childb),\
  \ 0), 1\n    ), 0)                                                           AS\
  \ session_share_pct\nFROM levelflows lf\nWHERE lf.personality_childb IS NOT NULL\n\
  \  AND lf.avatarinfo IS NOT NULL\nGROUP BY lf.personality_childb, json_extract_scalar(lf.avatarinfo,\
  \ '$.ChildB')\nORDER BY personality, childb_avatar\n\n"
