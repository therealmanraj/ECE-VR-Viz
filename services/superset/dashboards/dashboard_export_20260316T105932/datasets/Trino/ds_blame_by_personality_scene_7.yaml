sql: "-- Dataset Name: ds_blame_by_personality_scene\nSELECT\n    lf.personality_childb\
  \                                       AS personality,\n    CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS BIGINT) AS scene_no,\n    COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END)                  AS total_user_responses,\n   \
  \ COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user' AND json_extract_scalar(conv_obj,\
  \ '$.blame') = 'true' THEN 1 END) AS blame_responses,\n    COALESCE(ROUND(\n   \
  \     100.0 * COUNT(CASE WHEN json_extract_scalar(conv_obj, '$.type') = 'user' AND\
  \ json_extract_scalar(conv_obj, '$.blame') = 'true' THEN 1 END)\n        / NULLIF(COUNT(CASE\
  \ WHEN json_extract_scalar(conv_obj, '$.type') = 'user' THEN 1 END), 0), 1\n   \
  \ ), 0)                                                       AS blame_rate_pct\n\
  FROM levelflows lf\nCROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\n\
  CROSS JOIN UNNEST(CAST(json_extract(scene_obj, '$.conversations') AS ARRAY(JSON)))\
  \ AS t2(conv_obj)\nWHERE lf.personality_childb IS NOT NULL\nGROUP BY lf.personality_childb,\
  \ json_extract_scalar(scene_obj, '$.sceneNo')\nORDER BY personality, scene_no\n\n"
