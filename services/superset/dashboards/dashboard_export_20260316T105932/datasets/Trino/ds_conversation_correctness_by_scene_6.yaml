sql: "-- Dataset Name: ds_conversation_correctness_by_scene\n-- Double UNNEST: scenes\
  \ then conversations\nSELECT\n    lf.levelname                                 \
  \               AS level_name,\n    lf.personality_childb                      \
  \                 AS personality,\n    CAST(json_extract_scalar(scene_obj, '$.sceneNo')\
  \ AS BIGINT) AS scene_no,\n    COUNT(*)                                        \
  \            AS total_responses,\n    SUM(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.isCorrect') = 'true' THEN 1 ELSE 0 END)          AS correct_responses,\n  \
  \  SUM(CASE WHEN json_extract_scalar(conv_obj, '$.isCorrect') = 'false' THEN 1 ELSE\
  \ 0 END)        AS incorrect_responses,\n    COALESCE(ROUND(\n        100.0 * SUM(CASE\
  \ WHEN json_extract_scalar(conv_obj, '$.isCorrect') = 'true' THEN 1 ELSE 0 END)\n\
  \        / NULLIF(COUNT(*), 0), 1\n    ), 0)                                   \
  \                    AS accuracy_pct\nFROM levelflows lf\nCROSS JOIN UNNEST(CAST(lf.scene\
  \ AS ARRAY(JSON))) AS t(scene_obj)\nCROSS JOIN UNNEST(CAST(json_extract(scene_obj,\
  \ '$.conversations') AS ARRAY(JSON))) AS t2(conv_obj)\nWHERE json_extract_scalar(conv_obj,\
  \ '$.type') = 'user'\nGROUP BY lf.levelname, lf.personality_childb, json_extract_scalar(scene_obj,\
  \ '$.sceneNo')\nORDER BY level_name, scene_no\n\n"
