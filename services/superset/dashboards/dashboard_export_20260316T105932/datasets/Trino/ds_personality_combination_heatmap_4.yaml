sql: "-- Dataset Name: ds_personality_combination_heatmap\nSELECT\n    COALESCE(lf.personality_childa,\
  \ 'Unknown')                  AS personality_child_a,\n    COALESCE(lf.personality_childb,\
  \ 'Unknown')                  AS personality_child_b,\n    COUNT(*)            \
  \                                        AS total_sessions,\n    SUM(CASE WHEN lf.levelcomplete\
  \ = true THEN 1 ELSE 0 END)   AS completions,\n    COALESCE(ROUND(\n        100.0\
  \ * SUM(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)\n        / NULLIF(COUNT(*),\
  \ 0), 1\n    ), 0)                                                       AS pass_rate_pct\n\
  FROM levelflows lf\nGROUP BY lf.personality_childa, lf.personality_childb\nORDER\
  \ BY pass_rate_pct ASC\n\n"
