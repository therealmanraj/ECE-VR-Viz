sql: "-- Dataset Name: ds_personality_pass_rate\nSELECT\n    lf.personality_childb\
  \                                       AS personality_child_b,\n    lf.levelname\
  \                                                AS level_name,\n    COUNT(*)  \
  \                                                  AS total_sessions,\n    SUM(CASE\
  \ WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)   AS completed_sessions,\n   \
  \ COALESCE(ROUND(\n        100.0 * SUM(CASE WHEN lf.levelcomplete = true THEN 1\
  \ ELSE 0 END)\n        / NULLIF(COUNT(*), 0), 1\n    ), 0)                     \
  \                                  AS pass_rate_pct\nFROM levelflows lf\nWHERE lf.personality_childb\
  \ IS NOT NULL\nGROUP BY lf.personality_childb, lf.levelname\nORDER BY pass_rate_pct\
  \ ASC\n\n"
