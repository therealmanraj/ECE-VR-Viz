table_name: ds_sankey_demo_train_all
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: mongo
schema: langara-dev-client
sql: |
  SELECT source, target, value
  FROM (
      WITH scene_stats AS (
          SELECT
              lf._id AS flow_id,
              lf.levelcomplete,
              CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT) AS scene_no,
              json_extract_scalar(scene_obj, '$.sceneComplete') = 'true' AS scene_complete,
              COUNT(CASE
                  WHEN json_extract_scalar(conv_obj, '$.type') = 'user'
                  AND json_extract_scalar(conv_obj, '$.isCorrect') = 'false'
                  THEN 1 END) AS wrong_responses
          FROM levelflows lf
          CROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)
          CROSS JOIN UNNEST(CAST(json_extract(scene_obj, '$.conversations') AS ARRAY(JSON))) AS t2(conv_obj)
          WHERE lf.levelname = 'Demo Train'
          GROUP BY
              lf._id,
              lf.levelcomplete,
              CAST(json_extract_scalar(scene_obj, '$.sceneNo') AS BIGINT),
              json_extract_scalar(scene_obj, '$.sceneComplete')
      ),
      best_session AS (
          SELECT
              flow_id,
              levelcomplete,
              MAX(CASE WHEN scene_complete THEN scene_no ELSE 0 END) AS last_completed_scene
          FROM scene_stats
          GROUP BY flow_id, levelcomplete
      ),
      wrong_per_scene AS (
          SELECT
              scene_no,
              SUM(wrong_responses) AS total_wrong
          FROM scene_stats
          GROUP BY scene_no
      ),
      flows AS (
          SELECT
              CONCAT('Scene ', CAST(n AS VARCHAR)) AS source,
              CONCAT('Scene ', CAST(n + 1 AS VARCHAR)) AS target,
              COUNT(*) AS value
          FROM best_session
          CROSS JOIN UNNEST(SEQUENCE(1, last_completed_scene - 1)) AS t(n)
          WHERE last_completed_scene > 1
          GROUP BY n

          UNION ALL

          SELECT
              CONCAT('Scene ', CAST(last_completed_scene AS VARCHAR)) AS source,
              'Session Interrupted' AS target,
              COUNT(*) AS value
          FROM best_session
          WHERE levelcomplete = false
            AND last_completed_scene > 0
          GROUP BY last_completed_scene

          UNION ALL

          SELECT
              CONCAT('Scene ', CAST(last_completed_scene AS VARCHAR)) AS source,
              'Level Complete \u2705' AS target,
              COUNT(*) AS value
          FROM best_session
          WHERE levelcomplete = true
          GROUP BY last_completed_scene

          UNION ALL

          SELECT
              CONCAT('Scene ', CAST(scene_no AS VARCHAR)) AS source,
              'Wrong Responses' AS target,
              total_wrong AS value
          FROM wrong_per_scene
          WHERE total_wrong > 0
      )
      SELECT * FROM flows
  ) journey
  ORDER BY value DESC
