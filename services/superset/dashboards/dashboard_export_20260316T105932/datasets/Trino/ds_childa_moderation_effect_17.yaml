sql: "-- Dataset Name: ds_childa_moderation_effect\n-- Same ChildB personality, different\
  \ ChildA \u2014 pivot showing pass rate and blame rate per ChildA\nSELECT\n    lf.personality_childb\
  \                                            AS childb_identity,\n    COALESCE(ROUND(\n\
  \        100.0 * SUM(CASE WHEN lf.personality_childa = 'Indigenous Off-Reserve'\n\
  \                         AND lf.levelcomplete = true THEN 1 ELSE 0 END)\n     \
  \   / NULLIF(SUM(CASE WHEN lf.personality_childa = 'Indigenous Off-Reserve' THEN\
  \ 1 ELSE 0 END), 0), 1\n    ), 0)                                              \
  \              AS earline_pass_rate,\n    COALESCE(ROUND(\n        100.0 * SUM(CASE\
  \ WHEN lf.personality_childa = 'Indigenous Family'\n                         AND\
  \ lf.levelcomplete = true THEN 1 ELSE 0 END)\n        / NULLIF(SUM(CASE WHEN lf.personality_childa\
  \ = 'Indigenous Family' THEN 1 ELSE 0 END), 0), 1\n    ), 0)                   \
  \                                         AS gailiya_pass_rate,\n    COALESCE(ROUND(\n\
  \        100.0 * SUM(CASE WHEN lf.personality_childa = 'War_Refugee'\n         \
  \                AND lf.levelcomplete = true THEN 1 ELSE 0 END)\n        / NULLIF(SUM(CASE\
  \ WHEN lf.personality_childa = 'War_Refugee' THEN 1 ELSE 0 END), 0), 1\n    ), 0)\
  \                                                            AS mattie_pass_rate,\n\
  \    COALESCE(ROUND(\n        100.0 * COUNT(CASE WHEN lf.personality_childa = 'Indigenous\
  \ Off-Reserve'\n                           AND json_extract_scalar(conv_obj, '$.type')\
  \ = 'user'\n                           AND json_extract_scalar(conv_obj, '$.blame')\
  \ = 'true' THEN 1 END)\n        / NULLIF(COUNT(CASE WHEN lf.personality_childa =\
  \ 'Indigenous Off-Reserve'\n                            AND json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END), 0), 1\n    ), 0)                             \
  \                               AS earline_blame_rate,\n    COALESCE(ROUND(\n  \
  \      100.0 * COUNT(CASE WHEN lf.personality_childa = 'Indigenous Family'\n   \
  \                        AND json_extract_scalar(conv_obj, '$.type') = 'user'\n\
  \                           AND json_extract_scalar(conv_obj, '$.blame') = 'true'\
  \ THEN 1 END)\n        / NULLIF(COUNT(CASE WHEN lf.personality_childa = 'Indigenous\
  \ Family'\n                            AND json_extract_scalar(conv_obj, '$.type')\
  \ = 'user' THEN 1 END), 0), 1\n    ), 0)                                       \
  \                     AS gailiya_blame_rate,\n    COALESCE(ROUND(\n        100.0\
  \ * COUNT(CASE WHEN lf.personality_childa = 'War_Refugee'\n                    \
  \       AND json_extract_scalar(conv_obj, '$.type') = 'user'\n                 \
  \          AND json_extract_scalar(conv_obj, '$.blame') = 'true' THEN 1 END)\n \
  \       / NULLIF(COUNT(CASE WHEN lf.personality_childa = 'War_Refugee'\n       \
  \                     AND json_extract_scalar(conv_obj, '$.type') = 'user' THEN\
  \ 1 END), 0), 1\n    ), 0)                                                     \
  \       AS mattie_blame_rate\nFROM levelflows lf\nCROSS JOIN UNNEST(CAST(lf.scene\
  \ AS ARRAY(JSON))) AS t(scene_obj)\nCROSS JOIN UNNEST(CAST(json_extract(scene_obj,\
  \ '$.conversations') AS ARRAY(JSON))) AS t2(conv_obj)\nWHERE lf.avatarinfo IS NOT\
  \ NULL\n  AND lf.personality_childb IS NOT NULL\nGROUP BY lf.personality_childb\n\
  ORDER BY earline_pass_rate ASC\n\n"
