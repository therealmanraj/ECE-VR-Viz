sql: "-- Dataset Name: ds_attempts_per_student_per_level\nSELECT\n    lf.userid  \
  \                                                 AS user_id,\n    lf.levelname\
  \                                                AS level_name,\n    COUNT(*)  \
  \                                                  AS attempt_count,\n    MAX(CASE\
  \ WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)   AS eventually_completed\nFROM\
  \ levelflows lf\nGROUP BY lf.userid, lf.levelname\nORDER BY attempt_count DESC\n\
  \n"
