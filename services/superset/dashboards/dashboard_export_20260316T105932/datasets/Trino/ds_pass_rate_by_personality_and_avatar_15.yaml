sql: "-- Dataset Name: ds_pass_rate_by_personality_and_avatar\nSELECT\n    lf.personality_childb\
  \                                           AS personality,\n    json_extract_scalar(lf.avatarinfo,\
  \ '$.ChildB')                  AS childb_avatar,\n    COUNT(*)                 \
  \                                       AS sessions_attempted,\n    SUM(CASE WHEN\
  \ lf.levelcomplete = true THEN 1 ELSE 0 END)        AS sessions_completed,\n   \
  \ COALESCE(ROUND(\n        100.0 * SUM(CASE WHEN lf.levelcomplete = true THEN 1\
  \ ELSE 0 END)\n        / NULLIF(COUNT(*), 0), 1\n    ), 0)                     \
  \                                      AS pass_rate_pct\nFROM levelflows lf\nWHERE\
  \ lf.personality_childb IS NOT NULL\n  AND lf.avatarinfo IS NOT NULL\nGROUP BY lf.personality_childb,\
  \ json_extract_scalar(lf.avatarinfo, '$.ChildB')\nORDER BY personality, childb_avatar\n\
  \n"
