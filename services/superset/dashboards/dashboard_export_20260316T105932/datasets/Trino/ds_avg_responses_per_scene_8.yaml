catalog: mongo
schema: langara-dev-client
sql: "-- Dataset Name: ds_avg_responses_per_scene\nSELECT\n    lf.levelname      \
  \                                          AS level_name,\n    lf.personality_childb\
  \                                       AS personality,\n    CAST(json_extract_scalar(scene_obj,\
  \ '$.sceneNo') AS BIGINT) AS scene_no,\n    COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END)                   AS total_user_responses,\n  \
  \  COUNT(DISTINCT lf._id)                                      AS unique_sessions,\n\
  \    COALESCE(ROUND(\n        1.0 * COUNT(CASE WHEN json_extract_scalar(conv_obj,\
  \ '$.type') = 'user' THEN 1 END)\n        / NULLIF(COUNT(DISTINCT lf._id), 0), 2\n\
  \    ), 0)                                                       AS avg_responses_per_session\n\
  FROM levelflows lf\nCROSS JOIN UNNEST(CAST(lf.scene AS ARRAY(JSON))) AS t(scene_obj)\n\
  CROSS JOIN UNNEST(CAST(json_extract(scene_obj, '$.conversations') AS ARRAY(JSON)))\
  \ AS t2(conv_obj)\nGROUP BY lf.levelname, lf.personality_childb, json_extract_scalar(scene_obj,\
  \ '$.sceneNo')\nORDER BY level_name, scene_no\n\n"
