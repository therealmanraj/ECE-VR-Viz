sql: "-- Dataset Name: ds_childa_identity_pass_rate\n-- One row per childa_identity\
  \ x childb_identity \u2014 no avatar grouping\n-- Root cause fix: aggregate at identity\
  \ level so SUM() in Superset reads one value per cell\nSELECT\n    lf.personality_childa\
  \                                            AS childa_identity,\n    lf.personality_childb\
  \                                            AS childb_identity,\n    COUNT(*) \
  \                                                        AS total_sessions,\n  \
  \  SUM(CASE WHEN lf.levelcomplete = true THEN 1 ELSE 0 END)         AS completed_sessions,\n\
  \    COALESCE(ROUND(\n        100.0 * SUM(CASE WHEN lf.levelcomplete = true THEN\
  \ 1 ELSE 0 END)\n        / NULLIF(COUNT(*), 0), 1\n    ), 0)                   \
  \                                         AS pass_rate_pct\nFROM levelflows lf\n\
  WHERE lf.personality_childa IS NOT NULL\n  AND lf.personality_childb IS NOT NULL\n\
  GROUP BY\n    lf.personality_childa,\n    lf.personality_childb\nORDER BY childa_identity,\
  \ childb_identity\n\n"
