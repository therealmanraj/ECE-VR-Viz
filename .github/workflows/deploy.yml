name: Deploy to Azure VM

on:
  push:
    branches:
      - main
      - migrate-to-new-version
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set deploy directory
        run: |
          if [ "${{ github.ref_name }}" = "migrate-to-new-version" ]; then
            echo "DEPLOY_DIR=/data/ece-vr-superset-stage" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=/data/ece-vr-superset" >> $GITHUB_ENV
          fi

      - name: Deploy to VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ECE }}
          VM_HOST: ${{ secrets.VM_HOST_ECE }}
          VM_USER: ${{ secrets.VM_USER_ECE }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts

          # Create project directory on VM
          ssh -i ~/.ssh/deploy_key $VM_USER@$VM_HOST "mkdir -p $DEPLOY_DIR"

          # Sync code to VM
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            ./ $VM_USER@$VM_HOST:$DEPLOY_DIR/

          # Deploy on VM
          ssh -i ~/.ssh/deploy_key $VM_USER@$VM_HOST << EOF
            cd $DEPLOY_DIR

            # Stop existing containers
            docker-compose down || true

            # Start services
            docker-compose up -d

            # Show status
            docker-compose ps
          EOF
